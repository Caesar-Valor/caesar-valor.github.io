<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages muestra este archivo en cualquier ruta que no exista (por ejemplo /a/b/c).
     La <base> hace que css/, img/ y js/ carguen desde la raíz del sitio a cualquier profundidad.
     Si publicas en usuario.github.io/NOMBRE-DEL-REPO/, cambia href="/" por href="/NOMBRE-DEL-REPO/". -->
<base href="/">
<script>
  // Abierta directamente (archivo local o .../404.html): las rutas se resuelven junto a este archivo
  if (location.protocol === 'file:' || /\/404\.html$/.test(location.pathname)) {
    document.querySelector('base').href = location.href;
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · César Valenzuela</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="img/favicon-64.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<!-- Aplica el tema antes de pintar para evitar parpadeos -->
<script>
  (function () {
    var t;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    // Con JS activo, las animaciones de entrada pueden ocultar contenido hasta mostrarlo
    document.documentElement.classList.add('js');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="nav" aria-label="Principal">
  <div class="wrap">
    <a href="index.html" class="brand">
      <span class="brand-mark"><img src="img/noir-emblema.webp" alt="" width="242" height="280"></span>
      <span class="brand-name">César Valenzuela</span>
    </a>
    <button class="theme-btn" type="button" aria-label="Cambiar a modo noche">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</nav>

<main>
  <section class="notfound">
    <div class="wrap">
      <figure class="lamina notfound-lamina">
        <img src="img/noir-dormido.webp" alt="Noir, el gato negro, durmiendo" width="554" height="896">
      </figure>
      <div>
        <h1>Noir está dormido.</h1>
        <p>Este expediente no existe.</p>
        <a href="index.html" class="btn btn-primary">Volver al inicio</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="footer-brand">
      <span>© <span id="year"></span> César Valenzuela</span>
      <img class="footer-mark" src="img/noir-emblema.webp" alt="" width="242" height="280" loading="lazy">
    </p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
